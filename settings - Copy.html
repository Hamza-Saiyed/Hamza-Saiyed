<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom CSS */
        body {
            font-family: Roboto, Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #333333;
            line-height: 1.6;
        }

        .navbar {
            background-color: #3498db;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .settings-container {
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        h1 {
            color: #3498db;
            font-size: 32px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }

        .footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            margin-top: 50px;
        }

        /* Scroll Fade-In Animation */
        .scroll-fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .scroll-fade-in.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Interactive Background (Hero Section - Modified for Settings Page) */
        .interactive-bg {
            position: relative;
            overflow: hidden;
            height: 200px; /* Adjust height as needed */
            background: linear-gradient(to right, #3498db, #2ecc71); /* Example gradient */
        }

        .interactive-bg .bubble {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            animation: float 4s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-20px); /* Adjust float height */
            }
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">TaskMaster</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Index</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="tasklist.html">Tasklist</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="signup.html">Signup</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="about.html">About</a>
            </li></ul>
            </div>
        </div>
    </nav>

    <!-- Interactive Background (Modified for Settings Page) -->
    <div class="interactive-bg">
        <!-- Bubbles -->
        <div class="bubble" style="width: 20px; height: 20px; left: 10%; bottom: 0;"></div>
        <div class="bubble" style="width: 40px; height: 40px; left: 30%; bottom: 0; animation-delay: 1s;"></div>
        <div class="bubble" style="width: 30px; height: 30px; left: 50%; bottom: 0; animation-delay: 2s;"></div>
        <div class="bubble" style="width: 50px; height: 50px; left: 70%; bottom: 0; animation-delay: 0.5s;"></div>
        <div class="bubble" style="width: 25px; height: 25px; left: 90%; bottom: 0; animation-delay: 1.5s;"></div>
    </div>

    <!-- Settings Content -->
    <div class="container settings-container scroll-fade-in">
        <h1>Settings</h1>

        <section id="user-profile" class="mb-4">
            <h2>User Profile Management</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Your Name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Your Email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="New Password">
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </section>

        <section id="notification-settings" class="mb-4">
            <h2>Notification Settings</h2>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="emailReminders" checked>
                <label class="form-check-label" for="emailReminders">
                    Email Reminders
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="pushNotifications">
                <label class="form-check-label" for="pushNotifications">
                    Push Notifications
                </label>
            </div>
            <div class="mb-3">
                <label for="notificationFrequency" class="form-label">Notification Frequency</label>
                <select class="form-select" id="notificationFrequency">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="none">None</option>
                </select>
            </div>
        </section>

        <section id="customization-options">
            <h2>Customization Options</h2>
            <div class="mb-3">
                <label for="themeSelection" class="form-label">Theme Selection</label>
                <select class="form-select" id="themeSelection">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="system">System Default</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="defaultPriority" class="form-label">Default Task Priority</label>
                <select class="form-select" id="defaultPriority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </section>

        <button class="btn btn-success mt-3" onclick="showSaveConfirmation()">Save Changes</button>
        <div id="saveConfirmation" class="alert alert-success mt-3" style="display:none;">
            Settings saved successfully!
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        &copy; 2024 TaskMaster. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Scroll Fade-In Animation
        const elements = document.querySelectorAll('.scroll-fade-in');

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        });

        elements.forEach(element => {
            observer.observe(element);
        });

         // Save Confirmation
        function showSaveConfirmation() {
            const confirmation = document.getElementById('saveConfirmation');
            confirmation.style.display = 'block';
            setTimeout(() => {
                confirmation.style.display = 'none';
            }, 3000); // Hide after 3 seconds
        }
        
        // Interactive Background Bubbles (Simplified - adjust as needed)
        document.addEventListener('DOMContentLoaded', function() {
            const interactiveBg = document.querySelector('.interactive-bg');
            const bubbleCount = 10; // Number of bubbles

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');

                // Random size, position, and animation delay
                const size = Math.random() * 30 + 10; // Size between 10 and 40
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.bottom = '0';
                bubble.style.animationDelay = Math.random() * 3 + 's';

                interactiveBg.appendChild(bubble);
            }
        });
    </script>
</body>

</html>
